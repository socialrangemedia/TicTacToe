services:
  app:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ..:/app
      - node_modules:/app/node_modules
      - ./entrypoint.sh:/entrypoint.sh:ro
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
    command: sh /entrypoint.sh
    restart: unless-stopped

  # Optioneel: uncomment voor Postgres (API's met database)
